name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 1 * *"   # first day of each month: catches dependency releases that break the pipeline
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pip install -e . --no-deps
      - run: colonycounter version
      - run: python -m pytest tests/test_platemap.py tests/test_pipeline_units.py -q

  end-to-end:
    name: synthetic plates, all formats (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_synthetic.py tests/test_formats.py -q
      - name: keep the synthetic report as a build artifact
        if: always()
        run: |
          python examples/make_synthetic_plates.py --out synthetic --seed 7
          python colonycounter/cfa_run.py synthetic/PlateMap.xlsx --out synthetic/Results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-report
          path: |
            synthetic/Results/report.html
            synthetic/Results/*.csv
            synthetic/Results/run_info.json
