name: publish to PyPI

# Runs when a GitHub release is published. Uses PyPI "trusted publishing" (OpenID Connect), so no
# API token is stored anywhere: PyPI is told once, at pypi.org/manage/account/publishing/, to trust
# this repository's publish.yml workflow and the "pypi" environment. The version that is uploaded is
# the one in colonycounter/__init__.py, which must match the release tag (vX.Y.Z).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Check that the package version matches the release tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import colonycounter; print(colonycounter.__version__)")
          test "v$v" = "${{ github.event.release.tag_name }}" || { echo "version $v does not match tag ${{ github.event.release.tag_name }}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
